services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Public Convex API origin used by the frontend runtime.
        VITE_CONVEX_URL: ${VITE_CONVEX_URL:?set VITE_CONVEX_URL}
        # Public Convex HTTP actions/site origin (required for self-hosted Convex).
        VITE_CONVEX_SITE_URL: ${VITE_CONVEX_SITE_URL:-}
    ports:
      - "${WEB_PORT:-4112}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
