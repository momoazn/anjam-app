version: 2.1

executors:
  go-bun:
    docker:
      - image: cimg/go:1.24
    environment:
      BUN_INSTALL: /home/circleci/.bun
      PATH: /home/circleci/.bun/bin:/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
  restore-bun-cache:
    steps:
      - restore_cache:
          keys:
            - bun-cache-{{ checksum "bun.lock" }}
  save-bun-cache:
    steps:
      - save_cache:
          key: bun-cache-{{ checksum "bun.lock" }}
          paths:
            - /home/circleci/.bun
            - /home/circleci/.bun/install/cache

jobs:
  lint_typecheck:
    executor: go-bun
    steps:
      - checkout
      - install-bun
      - restore-bun-cache
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save-bun-cache
      - run:
          name: Lint and typecheck
          command: bun run type:check && bun run lint
  tests:
    executor: go-bun
    steps:
      - checkout
      - install-bun
      - restore-bun-cache
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save-bun-cache
      - run:
          name: Unit tests
          command: bun run test:run

workflows:
  check:
    jobs:
      - lint_typecheck
      - tests:
          requires:
            - lint_typecheck
